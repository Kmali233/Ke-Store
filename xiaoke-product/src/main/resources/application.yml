server:
  address: 127.0.0.1
  # 端口规划：网关预留 8080；业务服务从 8081 起（product=8081，order=8082，user=8083 ...）
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: xiaoke-product
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xiaoke.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xiaoke:
  local-admin-enabled: false
  local-admin-key: ${LOCAL_ADMIN_KEY:}
  web:
    allowed-origins: []
    max-request-body-bytes: 1048576

logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"
