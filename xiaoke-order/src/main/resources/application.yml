server:
  address: 127.0.0.1
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: xiaoke-order
  profiles:
    default: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xiaoke.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xiaoke:
  admin:
    enabled: ${XIAOKE_ADMIN_AUTH_ENABLED:false}
    secret-base64: ${XIAOKE_ADMIN_JWT_SECRET_BASE64:}
  jwt:
    enabled: true
    secret-base64: ${XIAOKE_JWT_SECRET_BASE64}
    issuer: xiaoke-mall
    expiry-seconds: 7200
  local-admin-enabled: false
  local-admin-key: ${LOCAL_ADMIN_KEY:}
  payment:
    alipay:
      gateway: ${XIAOKE_ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      app-id: ${XIAOKE_ALIPAY_APP_ID:}
      seller-id: ${XIAOKE_ALIPAY_SELLER_ID:}
      private-key: ${XIAOKE_ALIPAY_PRIVATE_KEY:}
      public-key: ${XIAOKE_ALIPAY_PUBLIC_KEY:}
      notify-url: ${XIAOKE_ALIPAY_NOTIFY_URL:}
      buyer-origin: ${XIAOKE_ALIPAY_BUYER_ORIGIN:http://127.0.0.1:5173}
  order:
    product-base-url: ${PRODUCT_BASE_URL:http://127.0.0.1:8081/api}
    zone-id: Asia/Shanghai
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    preread-deadline-ms: 5000
    payment-timeout-minutes: ${XIAOKE_ORDER_PAYMENT_TIMEOUT_MINUTES:30}
    close-scan-delay-ms: ${XIAOKE_ORDER_CLOSE_SCAN_DELAY_MS:5000}
  web:
    allowed-origins: []
    max-request-body-bytes: 1048576

logging:
  config: classpath:audit-logback.xml
  pattern:
    level: "%5p [traceId:%X{traceId}]"
